version: "3.9"

services:
  db:
    image: postgres:16
    container_name: ustp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ustp
      POSTGRES_PASSWORD: ustp_dev_password
      POSTGRES_DB: ustp_dev
    ports:
      - "5432:5432"
    volumes:
      - ustp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ustp -d ustp_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ustp_pgdata:
