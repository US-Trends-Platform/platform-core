13. Derived Analytics Definitions
13.1 farm_income_as_pct_of_median_household_income
yaml


metric:
  schema_id: farm_income_as_pct_of_median_household_income
  name: Farm Income as Percentage of Median Household Income
  domain: agriculture-farming
  definition: Derived metric: (Net Farm Income per Farm) ÷ (Median Household Income) × 100
  short_name: Farm Income Relative to Median
  units: percent
  geographic_scope: US_NATIONAL
  cadence: ANNUAL
  methodology: |
    Calculation:
      Numerator: (Net Farm Income) ÷ (Number of Farms) → Net Farm Income per Farm
      Denominator: Median Household Income (Census)
      
    Neither numerator nor denominator is causal; ratio shows relative position.
    Real values used for comparability.
  known_limitations:
    - Farm income per farm approximate (aggregate ÷ count)
    - Median household income pre‑1967 reconstructed
    - Statistical comparison only; not causal relationship
  confidence_tier_source: MODELED_DERIVED
13.2 real_wage_growth_yoy
yaml


metric:
  schema_id: real_wage_growth_yoy
  name: Real Wage Growth Year‑Over‑Year
  domain: employment
  definition: Percentage change in average hourly earnings adjusted for inflation over previous year
  short_name: Real Wage Growth
  units: percent_change
  geographic_scope: US_NATIONAL
  cadence: MONTHLY
  methodology: |
    Derivation:
      1. Retrieve average hourly earnings (nominal)
      2. Adjust for inflation using CPI‑U (12‑month change)
      3. Calculate percentage change in real earnings
      
    Real earnings = (nominal earnings × CPI_base) ÷ CPI_current
    Growth = ((Real_t ÷ Real_t‑12) − 1) × 100
  known_limitations:
    - CPI adjustment methodology affects result
    - Pre‑1964 nominal wage series less consistent
    - Composition changes in workforce affect average
  confidence_tier_source: MODELED_DERIVED
14. Implementation Notes
14.1 Metric Registration Workflow


1. Document metric in this dictionary
2. Link to at least one dataset series
3. Assign confidence tier based on source
4. Define limitations explicitly
5. Populate database tables:
   - Insert into metrics
   - Insert into metric_series_links
   - Insert validation rules
