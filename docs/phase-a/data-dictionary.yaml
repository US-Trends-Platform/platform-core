14.3 Confidence Tier Inheritance
python


def inherit_confidence_tier(metric: Metric, observation_source: Source) -> ConfidenceTier:
    """
    Determine final confidence tier for observation.
    """
    # MODELED_DERIVED metrics override source tier
    if metric.confidence_tier_source == "MODELED_DERIVED":
        return ConfidenceTier.MODELED_DERIVED
    
    # Otherwise use source tier
    return observation_source.typical_confidence_tier
