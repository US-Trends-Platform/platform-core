4. Domain: Employment
4.1 unemployment_rate_total
yaml


metric:
  schema_id: unemployment_rate_total
  name: Unemployment Rate (Total)
  domain: employment
  definition: |
    Percentage of civilian labor force that is unemployed but actively seeking work
    Numerator: Unemployed persons (BLS CPS definition)
    Denominator: Civilian labor force (employed + unemployed)
  short_name: Unemployment Rate
  units: percent
  geographic_scope: US_NATIONAL
  cadence: MONTHLY
  methodology: |
    Source: Bureau of Labor Statistics Current Population Survey
    
    Survey: Approximately 60,000 eligible households monthly
    Measurement: Persons aged 16+ who are unemployed and actively looked for work in past 4 weeks
    Seasonally adjusted series used as default.
    
    Revisions: Annual benchmark revisions; seasonal factors updated annually.
  known_limitations:
    - Self-reported; no verification of job search activity
    - Margin of error monthly ≈ ±0.2 percentage points
    - 1940-1947 coverage expanded gradually
    - Racial ethnicity definition changed 2003
  requires_real_and_nominal_display: false
  is_monetary: false
  confidence_tier_source: SURVEY_ESTIMATE
  
  series_mappings:
    - dataset_slug: bls_cps
      series_code: LNS14000000
      role: PRIMARY
      start_date: 1948-01-01
      end_date: null
      methodology_notes: Civilian unemployment rate seasonally adjusted
4.2 total_nonfarm_employment
yaml


metric:
  schema_id: total_nonfarm_employment
  name: Total Nonfarm Employment
  domain: employment
  definition: Number of persons on establishment payrolls, excluding farms, private households, and non‑profit organizations
  short_name: Nonfarm Payrolls
  units: thousands
  geographic_scope: US_NATIONAL
  cadence: MONTHLY
  methodology: |
    Sources: BLS Current Employment Statistics survey of ~144,000 businesses and government agencies.
    
    Includes: Wage and salary workers on establishment payrolls
    Excludes: Self-employed, unpaid family workers, private household workers, agricultural workers
    Counted: On payroll during pay period including 12th of month
    
    Revisions: Annual benchmark reconciliation with unemployment insurance tax records.
  known_limitations:
    - Subject to sampling error (95% confidence ±100,000)
    - Benchmarks revised annually; historical series change
    - Pre-1939 coverage incomplete
  confidence_tier_source: SURVEY_ESTIMATE
  
  series_mappings:
    - dataset_slug: bls_cps  # Note: Actually BLS CES but documented as part of CPS dataset
      series_code: CES0000000001
      role: PRIMARY
      start_date: 1939-01-01
      end_date: null
4.3 average_hourly_earnings_total_private
yaml


metric:
  schema_id: average_hourly_earnings_total_private
  name: Average Hourly Earnings of All Private Employees
  domain: employment
  definition: Average hourly earnings for private-sector production and non‑supervisory employees
  short_name: Avg. Hourly Earnings
  units: dollars_per_hour
  currency_code: USD
  inflation_basis_year: 2012
  geographic_scope: US_NATIONAL
  cadence: MONTHLY
  methodology: |
    BLS CES survey. Covers production and non‑supervisory employees in private establishments.
    Excludes benefits, bonuses, commissions.
