6. Domain: Inflation & Cost of Living
6.1 cpi_all_items
yaml


metric:
  schema_id: cpi_all_items
  name: Consumer Price Index for All Urban Consumers: All Items
  domain: inflation-cost-of-living
  definition: |
    Measure of average change over time in prices paid by urban consumers for a market basket of consumer goods and services.
    Index (1982‑1984=100).
  short_name: CPI All Items
  units: index_1982_1984_100
  geographic_scope: US_NATIONAL
  cadence: MONTHLY
  methodology: |
    Bureau of Labor Statistics.
    
    Source: Expenditure survey of 24,000 consumers; 80,000 price quotes monthly.
    Coverage: Urban consumers (~93% of US population).
    Index base: 1982‑1984=100.
  known_limitations:
    - Pre‑1913 reconstructed (narrower basket)
    - Substitution bias inherent in fixed‑weight index
    - Methodological changes (geometric mean weighting 1999‑present)
    - Pre‑1978 excludes housing costs equivalent
  confidence_tier_source: SURVEY_ESTIMATE
  
  series_mappings:
    - dataset_slug: fred_inflation
      series_code: CPIAUCSL
      role: PRIMARY
      start_date: 1913-01-01
      end_date: null
    
    - dataset_slug: nber_macroeconomics_history
      series_code: HISTORICAL_CPI
      role: PRE_POST_BREAK
      start_date: 1776-01-01
      end_date: 1912-12-31
      methodology_notes: Academic reconstruction; not comparable to modern methodology
6.2 median_home_price_existing_homes
yaml


metric:
  schema_id: median_home_price_existing_homes
  name: Median Sales Price of Existing Single-Family Homes
  domain: inflation-cost-of-living
  definition: Median transaction price of previously occupied single‑family homes sold during period
  short_name: Median Home Price
  units: dollars
  currency_code: USD
  inflation_basis_year: 2012
  geographic_scope: US_NATIONAL
  cadence: MONTHLY
  methodology: |
