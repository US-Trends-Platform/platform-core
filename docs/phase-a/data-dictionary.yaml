  domain: healthcare
  definition: Average number of years a newborn would live if mortality patterns remain constant
  short_name: Life Expectancy
  units: years
  geographic_scope: US_NATIONAL
  cadence: ANNUAL
  methodology: |
    National Center for Health Statistics abridged life tables.
    
    Source: Complete death registration (since 1933).
