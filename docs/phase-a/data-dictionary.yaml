Data Dictionary
Project: U.S. Socioeconomic, Political & Agricultural Trends Platform
Version: 1.0.0
Date: 2026-08-06
Status: Draft for Team Review

1. Purpose
The Data Dictionary defines every metric published by the platform.

It provides:

Standardized definitions — what each metric measures and what it does not measure
Methodological clarity — how data is collected, processed, and classified
Provenance links — which authoritative sources provide data for each metric
Coverage boundaries — when and where a metric applies
Confidence classification — expected confidence tiers at source
Unit and conversion rules — standardized representation
Limitations and caveats — explicit, not hidden
A metric earns publication only after it appears in this dictionary and is linked to at least one source series.

2. Dictionary Structure
Each metric is documented as:

yaml


metric:
  schema_id: metric_slug
  name: Human-readable name
  domain: domain_slug
  definition: Clear definition with inclusions/exclusions
  short_name: Brief label
  units: Standardized units
  currency_code: ISO currency (if monetary)
  inflation_basis_year: Base year for real values
  geographic_scope: US_NATIONAL
  cadence: Primary cadence (e.g., ANNUAL, MONTHLY)
  methodology: Collection, calculation, and limitations
  known_limitations: Explicit limitations list
  requires_real_and_nominal_display: true/false
  is_monetary: true/false
  confidence_tier_source: Expected confidence tier at source
  
  series_mappings:
    - dataset_slug: source_dataset_slug
      series_code: external_series_id
      role: PRIMARY | SUPPLEMENTAL | PRE_POST_BREAK
      start_date: YYYY-MM-DD
      end_date: YYYY-MM-DD
      methodology_notes: Notes about mapping
3. Domain: Demographics
3.1 total_population
yaml


metric:
  schema_id: total_population
  name: Total Population
  domain: demographics
  definition: Resident population of the United States, including armed forces stationed in the US, excluding armed forces stationed abroad
  short_name: US Population
  units: count
  geographic_scope: US_NATIONAL
  cadence: ANNUAL
  methodology: |
    Sources:
      - 1790-2020: Decennial Census enumeration
      - Intercensal years: Census Bureau intercensal estimates (model-based)
      - Post-2020: Census Bureau population estimates
    
    Census [10-year] vs. estimates [annual] are methodologically distinct. Estimates are not measured counts. 
    Margin of error increases further from decennial year.
  known_limitations:
    - American Indians on reservations undercounted until 1950
    - 1870 enumeration excludes still-occupied Confederate states
    - 1920 enumeration disrupted by influenza pandemic
    - Armed forces overseas excluded until 1990 methodology changes
    - Estimates, not enumeration, between decennial years
  requires_real_and_nominal_display: false
  is_monetary: false
  confidence_tier_source: OFFICIAL_MEASUREMENT
  
  series_mappings:
    - dataset_slug: census_decennial
      series_code: DECENNIAL_POPULATION_TOTAL
      role: PRIMARY
      start_date: 1790-01-01
      end_date: 2020-12-31
      methodology_notes: Decennial enumeration (every 10 years)
    
    - dataset_slug: census_acs
      series_code: ACS_POPULATION_TOTAL
      role: SUPPLEMENTAL
      start_date: 2005-01-01
      end_date: null
      methodology_notes: Annual survey-based estimates; use for intercensal continuity
3.2 birth_rate
yaml


metric:
  schema_id: birth_rate
  name: Crude Birth Rate
  domain: demographics
  definition: Number of live births per 1,000 mid-year population
  short_name: Birth Rate
  units: per_1000_population
  geographic_scope: US_NATIONAL
  cadence: ANNUAL
  methodology: |
    Numerator: National Vital Statistics System complete count of registered births
    Denominator: Census Bureau intercensal population estimates (mid-year)
    
    Registration completeness: Virtually complete since 1933; earlier years under-registered
  known_limitations:
    - Pre-1933 registration incomplete; broader uncertainty
    - Mid-year denominator estimates questionable pre-1900
  confidence_tier_source: OFFICIAL_MEASUREMENT
