  confidence_tier_source: SURVEY_ESTIMATE
5. Domain: Economy
5.1 gdp_nominal
yaml


metric:
  schema_id: gdp_nominal
  name: Gross Domestic Product (Nominal)
  domain: economy
  definition: Market value of all final goods and services produced within a year, not adjusted for inflation
  short_name: Nominal GDP
  units: billions_of_dollars
  currency_code: USD
  geographic_scope: US_NATIONAL
  cadence: QUARTERLY
  methodology: |
    Bureau of Economic Analysis National Income and Product Accounts.
    
    Comprehensive measure using expenditure, income, and production approaches.
    Annual benchmarks with 5-year comprehensive revisions.
    Quarterly estimates revised as source data improve.
  known_limitations:
    - Pre‑1929 reconstructed from Kuznets & Kendrick (academic)
    - Revisions can be substantial years after publication
    - 1900‑1929 estimates less reliable
  requires_real_and_nominal_display: true
  is_monetary: true
  confidence_tier_source: OFFICIAL_MEASUREMENT
  
  series_mappings:
    - dataset_slug: bea_nipa
      series_code: GDP
      role: PRIMARY
      start_date: 1929-01-01
      end_date: null
    
    - dataset_slug: nber_macroeconomics_history
      series_code: HISTORICAL_GNP_NOMINAL  # GNP not GDP historically
      role: PRE_POST_BREAK
      start_date: 1776-01-01
      end_date: 1928-12-31
      methodology_notes: GNP estimates; distinct from GDP; pre‑1900 academic reconstruction
5.2 gdp_real
yaml


metric:
  schema_id: gdp_real
  name: Gross Domestic Product (Real)
  domain: economy
  definition: GDP adjusted for inflation using chain‑weighted 2012 dollars
  short_name: Real GDP
  units: billions_of_dollars_chained_2012
  currency_code: USD
  inflation_basis_year: 2012
  geographic_scope: US_NATIONAL
  cadence: QUARTERLY
  methodology: |
    BEA chain‑weighted methodology (implemented 1996).
    Pre‑1929: BEA backcasts using academic reconstructions.
    Real series published since 1929; methodologies differ over time.
  known_limitations:
    - Pre‑1929 backcast with significant uncertainty
    - Methodological breaks: 1929‑1946, 1947‑1979, 1980‑1995, 1996‑present
    - Chained‑dollar methodology not consistent pre‑1996
  requires_real_and_nominal_display: true
  is_monetary: true
  confidence_tier_source: OFFICIAL_MEASUREMENT
  
  series_mappings:
    - dataset_slug: bea_nipa
      series_code: GDPC1
      role: PRIMARY
      start_date: 1929-01-01
      end_date: null
5.3 federal_debt_held_public
yaml


metric:
  schema_id: federal_debt_held_public
  name: Federal Debt Held by the Public
  domain: economy
  definition: Outstanding Treasury securities held by all investors outside the federal government, including the Federal Reserve
  short_name: Federal Debt (Public)
  units: billions_of_dollars
  currency_code: USD
  geographic_scope: US_NATIONAL
  cadence: MONTHLY
  methodology: |
    Treasury Department daily measurement; end‑of‑month values retained.
    
    Includes: Marketable Treasury securities; non‑marketable debt held by public
