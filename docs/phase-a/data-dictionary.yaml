  short_name: House Majority
  units: party_affiliation
  geographic_scope: US_NATIONAL
  cadence: BIENNIAL
  methodology: |
    House Office of the Historian; official roster at start of each Congress.
    
    Determined by seat count after general election; changes during Congress (e.g., deaths, party switching) not tracked.
