11.3 net_farm_income_inflation_adjusted
yaml


metric:
  schema_id: net_farm_income_inflation_adjusted
  name: Net Farm Income (Real)
  domain: agriculture-farming
  definition: Farm sector net income adjusted for inflation using GDP deflator (2012 dollars)
  short_name: Real Net Farm Income
  units: billions_of_dollars_chained_2012
  currency_code: USD
  inflation_basis_year: 2012
  geographic_scope: US_NATIONAL
  cadence: ANNUAL
  methodology: |
    USDA ERS Farm Income and Wealth Statistics.
    
    Net income = gross farm income − production expenses.
    Sector‑level aggregate, not per‑farm.
    Real series deflated by GDP implicit price deflator (2012=100).
  known_limitations:
    - Income includes government payments (subsidies)
    - Pre‑1929 reconstructed from Census/state reports
    - Inflation adjustment methodology changed (GDP deflator vs CPI)
    - Post‑1970 includes farm‑related income (e.g., agritourism)
  requires_real_and_nominal_display: true
  is_monetary: true
  confidence_tier_source: ADMINISTRATIVE_RECORD
