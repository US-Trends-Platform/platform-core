6.3 median_rent_national
yaml


metric:
  schema_id: median_rent_national
  name: Median Gross Rent
  domain: inflation-cost-of-living
  definition: Median contract rent plus utilities for renter‑occupied housing units
  short_name: Median Rent
  units: dollars
  currency_code: USD
  inflation_basis_year: 2012
  geographic_scope: US_NATIONAL
  cadence: ANNUAL
  methodology: |
    Census Bureau American Community Survey.
    
    Gross rent = contract rent + utilities if included.
