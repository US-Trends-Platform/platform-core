10.3 unauthorized_immigrant_population_estimate_pew
yaml


metric:
  schema_id: unauthorized_immigrant_population_estimate_pew
  name: Unauthorized Immigrant Population Estimate (Pew Research Center)
  domain: immigration
  definition: Estimated number of unauthorized immigrants residing in United States using residual method
  short_name: Unauthorized Estimate (Pew)
  units: count
  geographic_scope: US_NATIONAL
  cadence: ANNUAL
  methodology: |
    Pew Research Center residual method.
    
    Subtract legal immigrant population estimates (from DHS/USCIS) from total foreign‑born population (Census ACS).
    Adjust for undercount via demographic methods.
    Published with confidence intervals.
  known_limitations:
    - ESTIMATE, not administrative count
    - Residual method sensitive to legal population estimates
    - Subject to sampling error of ACS
    - Methodology changed 2006, 2013
    - Pre‑2005 reconstructed with greater uncertainty
  confidence_tier_source: ACADEMIC_ESTIMATE
  
  important_note: |
    THIS ESTIMATE MUST BE DISPLAYED IN SEPARATE TRACK FROM ADMINISTRATIVE DATA.
    No blending with LPR, H‑1B, naturalization counts.
    Confidence tier = ACADEMIC_ESTIMATE.
  
  series_mappings:
    - dataset_slug: pew_unauthorized_immigrants
      series_code: UNAUTH_TOTAL_US
      role: PRIMARY
      start_date: 1990-01-01
      end_date: null
