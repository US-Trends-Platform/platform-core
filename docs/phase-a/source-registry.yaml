## DEPARTMENT OF AGRICULTURE DATASETS

### USDA National Agricultural Statistics Service (NASS)

```yaml
source_id: usda_nass
agency_name: U.S. Department of Agriculture - National Agricultural Statistics Service
agency_level: FEDERAL
homepage_url: https://www.nass.usda.gov
documentation_url: https://quickstats.nass.usda.gov/api
api_base_url: https://quickstats.nass.usda.gov/api/api_GET
priority_rank: 2
license_id: public_domain
license_note: USDA data is public information; released under Title 7 U.S. Code § 2276

datasets:
  
  - dataset_id: usda_nass_census_of_agriculture
    slug: usda_nass_census_of_agriculture
    name: Census of Agriculture
    description: Complete enumeration of U.S. farms and ranches and those who operate them
    cadence: QUINQUENNIAL
    methodology_summary: Complete enumeration via mail, internet, telephone, face-to-face; includes all farms
    confidence_tier: ADMINISTRATIVE_RECORD
    retrieval_method: API
    api_endpoint: https://quickstats.nass.usda.gov/api/api_GET
    coverage_start_date: 1840-01-01
    methodology_note: Conducted every 5 years ending in 2 and 7; decennial before 1997; benchmark for all other agricultural statistics
    key_metrics:
      - Farm Count
      - Farm Acreage
      - Farm Income
      - Farm Operator Demographics
  
  - dataset_id: usda_nass_annual_surveys
    slug: usda_nass_annual_surveys
    name: Annual Agricultural Surveys
    description: Annual estimates of crop acreage, yield, production, inventories, prices
    cadence: ANNUAL
    methodology_summary: Statistical surveys (sample-based); not complete enumeration like Census
    confidence_tier: SURVEY_ESTIMATE
    important_note: NOT TO BE BLENDED WITH CENSUS DATA in visualizations; distinct methodological track
    retrieval_method: API
