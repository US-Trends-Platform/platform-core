CORE STATISTICAL AGENCIES
U.S. Census Bureau
yaml


source_id: census
agency_name: U.S. Census Bureau
agency_level: FEDERAL
homepage_url: https://www.census.gov
documentation_url: https://www.census.gov/data/developers.html
api_base_url: https://api.census.gov/data
retrieval_methods: API
priority_rank: 1
is_authoritative: true
is_active: true
authority_note: Constitutional mandate per Article I, Section 2; Census Act of 1790
license_id: public_domain
license_note: U.S. Federal Government works are not subject to copyright

datasets:
  
  - dataset_id: census_decennial
    slug: census_decennial
    name: Decennial Census of Population and Housing
    description: Complete count of population and housing units every 10 years
    geographic_scope: US_NATIONAL
    cadence: DECENNIAL
    documentation_url: https://www.census.gov/programs-surveys/decennial-census.html
    coverage_start_date: 1790-01-01
    coverage_end_date: null
    status: ACTIVE
    retrieval_method: API
    api_endpoint: https://api.census.gov/data/2020/dec/dp
    api_documentation: https://www.census.gov/data/developers.html
    
  - dataset_id: census_acs
    slug: census_acs
    name: American Community Survey
    description: Continuous annual survey of 3.5 million households estimating demographic, social, economic, and housing characteristics
    geographic_scope: US_NATIONAL
    cadence: ANNUAL
    coverage_start_date: 2005-01-01
    coverage_end_date: null
    methodology_summary: Annual weighted sample of approximately 3.5 million households; margins of error published
    confidence_tier: SURVEY_ESTIMATE
    retrieval_method: API
    api_endpoint: https://api.census.gov/data/{year}/acs/acs5
