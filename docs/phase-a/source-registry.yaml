7. Implementation Notes
7.1 Download vs. API Methods
API preferred when available (FRED, Census, BLS)
CSV/JSON download acceptable for stable, regularly updated datasets
PDF extraction last resort—manual intervention required
Manual curation for historical/contextual events
7.2 Metadata Requirements per Source
Each dataset must be documented with:


Field	Required for API	Required for Download
coverage_start_date	Yes	Yes
coverage_end_date	If known	If known
geographic_scope	Yes	Yes
cadence	Yes	Yes
methodology_summary	Yes	Yes
confidence_tier	Yes	Yes
retrieval_frequency	Yes	Yes
license_verification	Yes	Yes
7.3 Source-Specific Challenges & Notes


Source	Known Issues	Handling
USDA NASS Census vs. Annual	Different methodologies, never blended	Separate tracks; labels; methodology notes
Undocumented population estimates	Not administrative records	Separate track; flagged ACADEMIC_ESTIMATE
Historical reconstructions	Pre-20th century gaps, disputed numbers	Label HISTORICAL_RECONSTRUCTION; gaps explicit
BLS revisions	Annual benchmark revisions	Version snapshots; superseded flags
Congressional district data	Not in Phase 1	Deferred to Phase G
7.4 Confidence Tier Assignments


Agency Typical Tier	Exceptions
Census/BLS/BEA/BEA	OFFICIAL_MEASUREMENT
USDA NASS Census	ADMINISTRATIVE_RECORD
USDA NASS Annual Surveys	SURVEY_ESTIMATE
ACS, CPS	SURVEY_ESTIMATE
Administrative agencies (USCIS, IRS, CMS)	ADMINISTRATIVE_RECORD
Pre-1900 reconstructions	HISTORICAL_RECONSTRUCTION
Academic organizations (Pew, NBER)	ACADEMIC_ESTIMATE
Calculations/analytics	MODELED_DERIVED
8. Registry Integration with Schema
The source registry tables will be populated with:

sources → One entry per agency/organization
datasets → Each dataset in registry gets entry
dataset_series → Each series within dataset
licenses → License definitions standardized
metric_series_links → Links metrics to specific dataset series
