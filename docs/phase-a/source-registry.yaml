Source Registry
Project: U.S. Socioeconomic, Political & Agricultural Trends Platform
Version: 1.0.0
Date: 2026-08-06
Status: Draft for Team Review

1. Purpose
The Source Registry documents every authoritative data source used by the platform.

It serves as:

the primary reference for dataset acquisition and validation;
the provenance root for all published metrics;
the governance baseline for source priority, licensing, and methodology;
the maintenance schedule for automated updates;
the documentation hub for agency contacts, citation requirements, and historical notes.
Without an approved entry in this registry, no dataset can be ingested.

2. Registry Governance


Rule	Description
Government Source First	Federal agency sources prioritized; state/local sources deferred unless federated national aggregates exist
Authority Documentation Required	Must cite authorizing legislation, mission statement, or federal register notice
Public Accessibility	Source must provide data via public API, bulk download, or FOIA-compliant release
Unambiguous Provenance	Original agency remains identifiable after retrieval
License Verifiable	Each source's legitimate public use must be documented
Versioning Tracked	Changes to upstream dataset schemas/API endpoints recorded
Failure Notification	Automated alerts if source availability degrades
3. Registry Structure
The Source Registry is implemented as:

PostgreSQL tables (sources, datasets, dataset_series) — operational tracking
YAML configuration files (config/sources/) — declarative source definitions
Markdown documentation (docs/source-registry/) — human-readable reference
4. Common Citation Formats
yaml


APA: "{Series Name}. ({year}). {Agency Name}. Retrieved {retrieval_date} from {access_url}"
Chicago: "{Agency Name}. {year}. '{Series Name}.' Accessed {retrieval_date}. {access_url}."
MLA: "{Series Name}. {Agency Name}, {year}. Web. {retrieval_date}."
BibTeX: """
@dataset{agency_series_YYYY,
  author       = {{Agency Name}},
  title        = {{Series Name}},
  year         = {YYYY},
  publisher    = {{Agency Name}},
  url          = {access_url},
  note         = {retrieved: {retrieval_date}}
}
"""
5. Source Priority Tiers

Tier	Sources
Tier 1	Federal statistical agencies (Census, BLS, BEA, FRED)
Tier 2	Federal program agencies (USDA, USCIS, DHS, CMS, NCES, IRS, SSA)
Tier 3	Independent public institutions (CBO, OMB, Treasury/IRS Statistics)
Tier 4	Peer-reviewed academic reconstructions (NBER, IPUMS)
Tier 5	International organizations (World Bank, OECD) — used only for international comparisons
